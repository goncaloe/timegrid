<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
	<meta charset="UTF-8">
	<title th:text="${title}">Pending request</title>
</head>
<body style="margin:0;background:#f4f5f7;">
<div style="max-width:560px;margin:24px auto;background:#ffffff;border:1px solid #e5e5e5;">
	<div th:replace="~{mail/layout :: header}"></div>
	<div style="padding:24px;font-family:Arial,sans-serif;font-size:14px;color:#222222;line-height:1.5;">
		<p>Hello <span th:text="${recipientName}">Tiago</span>,</p>
		<p>There is a new request waiting for your approval:</p>
		<div style="background:#f4f5f7;border-left:4px solid #2d6cdf;padding:12px 16px;">
			<strong th:text="${title}">Hours Register Submitted</strong><br>
			<span th:text="${message}">Ines Moura submitted a hours register.</span>
		</div>
		<div th:if="${link != null}" th:replace="~{mail/layout :: button(${link}, 'Review order')}"></div>
	</div>
	<div th:replace="~{mail/layout :: footer}"></div>
</div>
</body>
</html>
