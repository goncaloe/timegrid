spring:
  datasource:
    url: ${TIMEGRID_DB_URL}
    username: ${TIMEGRID_DB_USERNAME}
    password: ${TIMEGRID_DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${TIMEGRID_MAIL_HOST:localhost}
    port: ${TIMEGRID_MAIL_PORT:587}
    username: ${TIMEGRID_MAIL_USERNAME:}
    password: ${TIMEGRID_MAIL_PASSWORD:}

timegrid:
  security:
    jwt:
      secret: ${TIMEGRID_JWT_SECRET}
  seed:
    # só o docker-compose de demonstração liga isto (TIMEGRID_SEED_ENABLED=true); numa instalação a sério fica false
    enabled: ${TIMEGRID_SEED_ENABLED:false}
  notifications:
    base-url: ${TIMEGRID_BASE_URL}
    email:
      enabled: ${TIMEGRID_MAIL_ENABLED:false}
  cors:
    allowed-origins: ${TIMEGRID_BASE_URL}
  websocket:
    allowed-origins: ${TIMEGRID_BASE_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: native