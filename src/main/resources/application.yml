spring:
  application:
    name: timegrid
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true

timegrid:
  security:
    jwt:
      secret: ${TIMEGRID_JWT_SECRET:}
      access-ttl: 15m
      refresh-ttl: 14d
  notifications:
    base-url: http://localhost:5173
    email:
      enabled: false
      from: no-reply@timegrid.pt

server:
  port: 8080