services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: timegrid
      POSTGRES_USER: timegrid
      POSTGRES_PASSWORD: timegrid
    ports:
      - "5432:5432"
    volumes:
      - timegrid_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timegrid -d timegrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TIMEGRID_DB_URL: jdbc:postgresql://db:5432/timegrid
      TIMEGRID_DB_USERNAME: timegrid
      TIMEGRID_DB_PASSWORD: timegrid
      TIMEGRID_JWT_SECRET: ${TIMEGRID_JWT_SECRET:-bXktdGltZWdyaWQtZGV2LXNlY3JldC1rZXktZm9yLWpzb24td2ViLXRva2Vucy10aW1lZ3JpZA==}
      TIMEGRID_BASE_URL: http://localhost:3000
      TIMEGRID_MAIL_HOST: mailpit
      TIMEGRID_MAIL_PORT: 1025
      TIMEGRID_MAIL_ENABLED: "true"
      # so serve para este compose de demonstracao; em producao a serio fica false
      TIMEGRID_SEED_ENABLED: ${TIMEGRID_SEED_ENABLED:-true}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  timegrid_db_data: